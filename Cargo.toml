[package]
name = "kiss-cache"
description = "Trim Nix binary caches according to GC roots"
version = "1.0.0"
authors = ["Astro <astro@spaceboyz.net>"]
edition = "2024"
license = "MIT"
homepage = "https://github.com/Mic92/kiss-cache"
repository = "https://github.com/Mic92/kiss-cache.git"

[dependencies]
lexopt = "0.3"
rustc-hash = "2"
indicatif = "0.18"

[dev-dependencies]
criterion = "0.7"
tempfile = "3"

[[bench]]
name = "narinfo"
harness = false

[lints.clippy]
# This tool deletes files; it must never crash on bad input or filesystem
# races. Every fallible operation must be handled explicitly.
unwrap_used = "deny"
expect_used = "deny"
