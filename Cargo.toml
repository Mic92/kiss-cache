[package]
name = "kiss-cache"
description = "Trim Nix binary caches according to GC roots"
version = "1.0.0"
authors = [
  "Astro <astro@spaceboyz.net>",
  "Jörg Thalheim <joerg@thalheim.io>",
]
edition = "2024"
license = "MIT"
homepage = "https://github.com/Mic92/kiss-cache"
repository = "https://github.com/Mic92/kiss-cache.git"

[dependencies]
lexopt = "0.3"
rustc-hash = "2"
# Default features pull in wasmbind, irrelevant for a Linux CLI.
indicatif = { version = "0.18", default-features = false, features = [ "unicode-width" ] }

[dev-dependencies]
# Default features pull in rayon and the plotters HTML report backend,
# neither of which is used: benchmarks are read from the terminal.
criterion = { version = "0.7", default-features = false, features = [ "cargo_bench_support" ] }
tempfile = "3"

[[bench]]
name = "narinfo"
harness = false

[lints.clippy]
# This tool deletes files; it must never crash on bad input or filesystem
# races. Every fallible operation must be handled explicitly.
unwrap_used = "deny"
expect_used = "deny"
